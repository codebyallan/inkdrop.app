<h2 mat-dialog-title>{{ data.title || ('shared.confirm_dialog.default_title' | translate) }}</h2>
<mat-dialog-content>
  {{ data.message || ('shared.confirm_dialog.default_message' | translate) }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="dialogRef.close(false)">
    {{ data.cancelLabel || ('shared.actions.cancel' | translate) }}
  </button>
  <button mat-flat-button [ngClass]="{ 'delete-btn': data.destructive }" (click)="dialogRef.close(true)">
    {{ data.confirmLabel || ('shared.actions.delete' | translate) }}
  </button>
</mat-dialog-actions>
