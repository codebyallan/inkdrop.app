<mat-drawer-container>
  <mat-drawer #drawer [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" autoFocus="false"
    (mousedown)="$event.preventDefault()">
    <div class="flex items-center justify-between px-2">
      <app-logo />
      @if (isMobile()) {
        <button mat-icon-button (click)="drawer.close()" (mousedown)="$event.preventDefault()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
    <mat-divider />
    <app-navbar [items]="NavItems()" (itemClicked)="isMobile() && drawer.close()" />
  </mat-drawer>

  <mat-drawer-content>
    <mat-toolbar class="flex items-center justify-between w-full shrink-0">
      <div class="flex items-center gap-4">
        @if (isMobile()) {
          <button mat-icon-button (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
        }
      </div>

      @if (user()) {
        <div class="flex items-center gap-3">
          <span class="font-medium">{{ 'layout.greeting' | translate:{ name: user()?.username } }}</span>
          <button mat-icon-button
            routerLink="/settings"
            [matTooltip]="'nav.settings' | translate">
            <mat-icon>settings</mat-icon>
          </button>
        </div>
      }
    </mat-toolbar>

    <!--
      <main> is the single scroll root for all feature pages.
      - flex: 1 1 0  → fills remaining height after the toolbar
      - overflow-y: auto → owns the vertical scroll; body never scrolls
      - overflow-x: hidden → prevents horizontal bleed from wide charts
    -->
    <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden flex flex-col">
      <div class="flex-grow">
        <router-outlet />
      </div>
      
      <footer class="flex justify-center items-center py-6 border-t border-[var(--mat-sys-outline-variant)] shrink-0">
        <p class="text-sm text-[var(--mat-sys-on-surface-variant)] text-center px-4 flex items-center gap-1.5">
          <span>{{ 'layout.footer.developed_by' | translate }}</span>
          <span class="font-bold text-[var(--mat-sys-on-surface)]">Allan Pereira</span>
          <span class="opacity-40">•</span>
          <a href="mailto:allan.pereira.dev@proton.me" class="transition-all hover:text-[var(--mat-sys-primary)] underline underline-offset-4 decoration-dotted">
            allan.pereira.dev@proton.me
          </a>
        </p>
      </footer>
    </main>
  </mat-drawer-content>
</mat-drawer-container>
