<app-page-layout [title]="'users.page_title' | translate">
  <button page-actions mat-icon-button (click)="refresh()" [disabled]="loading()">
    <mat-icon>refresh</mat-icon>
  </button>

  @if (authService.isAdmin()) {
    <button page-actions mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon>
      {{ 'shared.actions.new' | translate }}
    </button>
  }
  
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  
  <div class="user-grid">
    @if (loading()) {
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <app-user-card-skeleton />
      }
    } @else {
      @for (user of sortedUsers(); track user.id) {
        <app-user-card 
          [user]="user" 
          (edit)="editUser($event)" 
          (delete)="deleteUser($event.id)">
        </app-user-card>
      } @empty {
        <div class="empty-state">
          <mat-icon>group_off</mat-icon>
          <p>{{ 'users.empty_state' | translate }}</p>
        </div>
      }
    }
  </div>
</app-page-layout>
