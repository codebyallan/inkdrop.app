<mat-card class="user-card">
  <div class="card-header">
    <div class="header-main">
      <div class="user-info">
        <div class="avatar">
          <mat-icon>person</mat-icon>
        </div>
        <span class="username">{{ user().username }}</span>
      </div>
      <span class="role-badge" [class]="getRoleClass(user().role)">
        {{ user().role }}
      </span>
    </div>
    <div class="user-email">
      {{ user().email }}
    </div>
  </div>

  <div class="card-footer">
    <div class="user-meta">
      <mat-icon>calendar_today</mat-icon>
      <span>{{ user().createdAt | date: 'dd/MM/yyyy' }}</span>
    </div>
    
    @if (authService.isAdmin()) {
      <div class="actions">
        <button mat-icon-button (click)="edit.emit(user())" matTooltip="{{ 'shared.actions.edit' | translate }}">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="btn-delete" (click)="delete.emit(user())" matTooltip="{{ 'shared.actions.delete' | translate }}">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-card>
