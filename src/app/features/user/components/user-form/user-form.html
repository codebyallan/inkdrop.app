<h2 mat-dialog-title>{{ (data.mode === 'edit') ? 'Edit User' : 'New User' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" />
      <app-validation-message [control]="form.controls.username" [label]="'Username'"></app-validation-message>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <app-validation-message [control]="form.controls.email" [label]="'Email'"></app-validation-message>
    </mat-form-field>

    @if (data.mode !== 'edit') {
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        <app-validation-message [control]="form.controls.password" [label]="'Password'"></app-validation-message>
      </mat-form-field>
    }

    <mat-form-field>
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        @for (role of ROLES; track role.value) {
          <mat-option [value]="role.value">{{ role.label }}</mat-option>
        }
      </mat-select>
      <app-validation-message [control]="form.controls.role" [label]="'Role'"></app-validation-message>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancel</button>
  <button mat-flat-button (click)="save()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
