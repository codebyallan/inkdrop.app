<mat-card class="user-card skeleton">
  <div class="card-header">
    <div class="header-main">
      <div class="user-info">
        <div class="h-10 w-10 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        <div class="h-6 w-32 rounded-md bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      </div>
      <div class="h-4 w-16 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="user-email">
      <div class="h-3 w-48 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>

  <div class="card-footer">
    <div class="user-meta">
      <div class="h-3 w-3 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-3 w-20 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="actions">
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>
</mat-card>
