<mat-card class="location-card skeleton">
  <div class="card-header">
    <div class="header-main">
      <div class="title-group">
        <div class="h-5 w-5 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        <div class="h-6 w-32 rounded-md bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      </div>
    </div>
    <div class="location-description">
      <div class="h-3 w-full rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>

  <div class="card-footer">
    <div class="date-info">
      <div class="h-3 w-3 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-3 w-20 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="actions">
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>
</mat-card>
