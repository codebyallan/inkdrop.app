<h2 mat-dialog-title>{{ (data.mode === 'edit') ? ('locations.form_title_edit' | translate) : ('locations.form_title_new' | translate) }}</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
        <mat-form-field>
            <mat-label>{{ 'locations.fields.name' | translate }}</mat-label>
            <input matInput formControlName="name" />
            <app-validation-message [control]="form.controls.name" [label]="'locations.fields.name' | translate"></app-validation-message>
        </mat-form-field>
        <mat-form-field>
            <mat-label>{{ 'locations.fields.description' | translate }}</mat-label>
            <input matInput formControlName="description" />
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="cancel()">{{ 'shared.actions.cancel' | translate }}</button>
    <button mat-flat-button (click)="save()" [disabled]="form.invalid">{{ 'shared.actions.save' | translate }}</button>
</mat-dialog-actions>
