<app-page-layout [title]="'locations.page_title' | translate">
  <button page-actions mat-icon-button (click)="refresh()" [disabled]="loading()">
    <mat-icon>refresh</mat-icon>
  </button>

  @if (authService.isAdmin()) {
    <button page-actions mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon>
      {{ 'shared.actions.new' | translate }}
    </button>
  }
  
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  
  <div class="location-grid">
    @if (loading()) {
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <app-location-card-skeleton />
      }
    } @else {
      @for (location of sortedLocations(); track location.id) {
        <app-location-card 
          [location]="location" 
          (edit)="editLocation($event)" 
          (delete)="deleteLocation($event.id)">
        </app-location-card>
      } @empty {
        <div class="empty-state">
          <mat-icon>location_off</mat-icon>
          <p>{{ 'locations.empty_state' | translate }}</p>
        </div>
      }
    }
  </div>
</app-page-layout>
