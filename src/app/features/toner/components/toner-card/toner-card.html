<mat-card class="toner-card">
  <div class="color-indicator" [style.backgroundColor]="getTonerColor(toner.color)"></div>
  <div class="card-header">
    <div class="header-main">
      <span class="toner-model">{{ toner.model }}</span>
      <div class="color-badge" 
           [style.backgroundColor]="getTonerColor(toner.color)"
           [style.color]="getTonerTextColor(toner.color)">
        {{ toner.color }}
      </div>
    </div>
    <div class="toner-details">
      <span>{{ toner.manufacturer }}</span>
    </div>
  </div>

  <div class="card-body">
    <div class="inventory-section">
      <div class="quantity-info">
        <mat-icon>inventory_2</mat-icon>
        <div class="info-text">
          <span class="label">{{ 'toners.columns.quantity' | translate }}</span>
          <span class="value">{{ toner.quantity }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="date-info">
      <mat-icon>calendar_today</mat-icon>
      <span>{{ toner.createdAt | date: 'dd/MM/yyyy' }}</span>
    </div>
    
    @if (authService.isAdmin()) {
      <div class="actions">
        <button mat-icon-button (click)="edit.emit(toner)" matTooltip="{{ 'shared.actions.edit' | translate }}">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="btn-delete" (click)="delete.emit(toner)" matTooltip="{{ 'shared.actions.delete' | translate }}">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-card>
