<mat-card class="toner-card skeleton">
  <div class="card-header">
    <div class="header-main">
      <div class="h-5 w-32 rounded-md bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-4 w-16 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="toner-details">
      <div class="h-3 w-24 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>

  <div class="card-body">
    <div class="inventory-section">
      <div class="quantity-info">
        <div class="h-5 w-5 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        <div class="info-text">
          <div class="h-2 w-16 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse mb-1"></div>
          <div class="h-4 w-12 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="date-info">
      <div class="h-3 w-3 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-3 w-20 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="actions">
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>
</mat-card>
