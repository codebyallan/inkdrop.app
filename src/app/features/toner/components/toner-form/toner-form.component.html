<h2 mat-dialog-title>{{ (data.mode === 'edit') ? ('toners.form_title_edit' | translate) : ('toners.form_title_new' | translate) }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field>
      <mat-label>{{ 'toners.fields.model' | translate }}</mat-label>
      <input matInput formControlName="model" />
      <app-validation-message [control]="form.controls.model" [label]="'toners.fields.model' | translate"></app-validation-message>
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'toners.fields.manufacturer' | translate }}</mat-label>
      <input matInput formControlName="manufacturer" />
      <app-validation-message [control]="form.controls.manufacturer" [label]="'toners.fields.manufacturer' | translate"></app-validation-message>
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'toners.fields.color' | translate }}</mat-label>
      <input matInput formControlName="color" [readonly]="data.mode === 'edit'" />
      <app-validation-message [control]="form.controls.color" [label]="'toners.fields.color' | translate"></app-validation-message>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">{{ 'shared.actions.cancel' | translate }}</button>
  <button mat-flat-button (click)="save()" [disabled]="form.invalid">{{ 'shared.actions.save' | translate }}</button>
</mat-dialog-actions>
