<div class="min-h-screen flex items-center justify-center p-4">
  <mat-card class="max-w-md w-full p-6">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-md p-2">
        <mat-icon class="!text-white !text-3xl !w-auto !h-auto">lock</mat-icon>
      </div>
      <mat-card-title class="text-center text-xl font-semibold">Welcome back!</mat-card-title>
      <p class="text-center text-sm text-gray-500 mt-1">Manage your printing infrastructure with ease</p>
    </div>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter your username">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Enter your password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <button mat-raised-button type="submit" [disabled]="loginForm.invalid || isLoading()" class="w-full py-6 flex items-center justify-center !bg-blue-600 !text-white hover:!bg-blue-700 transition-colors">
          @if(isLoading()){
            <mat-spinner diameter="24" class="login-spinner"></mat-spinner>
          } @else {
            <span>Login</span>
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
