<app-page-layout [title]="'printers.page_title' | translate">
  <button page-actions mat-icon-button (click)="refresh()" [disabled]="loading()">
    <mat-icon>refresh</mat-icon>
  </button>

  @if (authService.isAdmin()) {
    <button page-actions mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon>
      {{ 'shared.actions.new' | translate }}
    </button>
  }
  
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  
  <div class="printer-grid">
    @if (loading()) {
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <app-printer-card-skeleton />
      }
    } @else {
      @for (printer of sortedPrinters(); track printer.id) {
        <app-printer-card 
          [printer]="printer" 
          (edit)="editPrinter($event)" 
          (delete)="deletePrinter($event.id)">
        </app-printer-card>
      } @empty {
        <div class="empty-state">
          <mat-icon>print</mat-icon>
          <p>{{ 'printers.empty_state' | translate }}</p>
        </div>
      }
    }
  </div>
</app-page-layout>
