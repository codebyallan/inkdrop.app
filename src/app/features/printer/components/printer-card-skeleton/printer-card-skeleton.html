<mat-card class="printer-card skeleton">
  <div class="card-header">
    <div class="header-main">
      <div class="h-5 w-32 rounded-md bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-4 w-16 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="printer-details">
      <div class="h-3 w-40 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse mb-1"></div>
      <div class="h-3 w-24 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>

  <div class="card-body">
    <div class="telemetry-section">
      <div class="pages-count">
        <div class="h-5 w-5 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        <div class="count-info">
          <div class="h-2 w-16 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse mb-1"></div>
          <div class="h-4 w-12 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
        </div>
      </div>

      <div class="toners-grid">
        @for (i of [1, 2, 3]; track i) {
          <div class="toner-item">
            <div class="toner-label">
              <div class="h-2 w-2 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
              <div class="h-3 w-12 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
            </div>
            <div class="custom-progress-bar skeleton-bar">
              <div class="custom-progress-fill skeleton-fill"></div>
            </div>
            <div class="h-3 w-8 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse text-right"></div>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="location-info">
      <div class="h-3 w-3 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-3 w-24 rounded bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
    <div class="actions">
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
      <div class="h-8 w-8 rounded-full bg-[var(--mat-sys-surface-variant)] opacity-60 animate-pulse"></div>
    </div>
  </div>
</mat-card>
